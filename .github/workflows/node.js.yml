name: Node.js CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hsdt'

      - name: Install dependencies
        run: npm ci

      - name: Resolve publish version
        id: pkg_meta
        if: |
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: ./projects/template-editor
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TARGET_VERSION" == *-* ]]; then
              DIST_TAG="next"
            else
              DIST_TAG="latest"
            fi
          else
            PUBLISHED=$(npm view "@hsdt/vue-template-editor@${BASE_VERSION}" version 2>/dev/null || true)
            if [ -n "$PUBLISHED" ]; then
              TARGET_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
              DIST_TAG="dev"
            else
              TARGET_VERSION="${BASE_VERSION}"
              DIST_TAG="latest"
            fi
          fi

          if [ "$TARGET_VERSION" != "$BASE_VERSION" ]; then
            npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          fi

          echo "version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build library and Angular shell demo
        run: npm run build:all:demo

      - name: Pack library tarball
        run: |
          mkdir -p dist
          npm pack --workspace @hsdt/vue-template-editor --pack-destination ./dist

      - name: Upload package tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-template-editor-package
          path: dist/hsdt-vue-template-editor-*.tgz

      - name: Prepare GitHub Pages bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf deploy
          mkdir -p deploy/guide
          cp -r dist/shell/browser/* deploy/
          cp -r projects/guide/* deploy/guide/
          touch deploy/.nojekyll

      - name: Deploy demo to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy

      - name: Publish @hsdt/vue-template-editor to GitHub Packages
        if: |
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: ./projects/template-editor
        run: npm publish --tag "${{ steps.pkg_meta.outputs.dist_tag }}"

      - name: Create GitHub Release on version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/hsdt-vue-template-editor-*.tgz
