<PageA4 style="padding: 12mm 15mm 12mm 18mm; font-size: 11.5pt; line-height: 1.35; height: auto !important;">
  <!-- Mã biểu mẫu góc trên phải -->
  <div class="text-right" style="font-size: 10pt; color: #666; margin-bottom: 4px; text-align: right;">
    BM 01
  </div>

  <!-- Header -->
  <div class="row no-gutters" style="margin-bottom: 12px;">
    <div class="col-4 text-center">
      <div class="font-weight-bold" style="font-size: 10.5pt; line-height: 1.25;">
        <div>BỆNH VIỆN TÂM THẦN</div>
        <div>THÀNH PHỐ ĐÀ NẴNG</div>
      </div>
      <div style="margin-top: 4px; text-align: left; padding-left: 8px;">
        <Textarea label="Khoa:" :modelValue="hsBenhAn.TenKhoaKham" line :rows="1" />
      </div>
    </div>

    <div class="col-5 text-center" style="padding: 0 6px;">
      <div class="font-weight-bold" style="font-size: 12.5pt; line-height: 1.3;">
        PHIẾU SÀNG LỌC NGUY CƠ SUY DINH DƯỠNG CHO NGƯỜI BỆNH NGOẠI TRÚ
      </div>
    </div>

    <div class="col-3" style="font-size: 10pt; padding-left: 8px; line-height: 1.35;">
      <div>MS: DD-01</div>
      <div>
        <Textarea label="Số vào viện:" :modelValue="hsBenhAn.SoVaoVien" line :rows="1" />
      </div>
      <div>
        <Textarea label="Mã người bệnh:" :modelValue="hsBenhAn.BenhNhan.Ma" line :rows="1" />
      </div>
    </div>
  </div>

  <!-- Thông tin hành chính -->
  <div class="row no-gutters" style="margin-bottom: 3px;">
    <div class="col-7">
      <Textarea label="Họ tên người bệnh:" :modelValue="hsBenhAn.BenhNhan.HoTen" line :rows="1" />
    </div>
    <div class="col-2" style="padding-left: 6px;">
      <Textarea label="Tuổi:" :modelValue="hsBenhAn.Tuoi" line :rows="1" />
    </div>
    <div class="col-3" style="padding-left: 6px;">
      <Textarea label="Nam/Nữ:" :modelValue="hsBenhAn.BenhNhan.GioiTinh ? 'Nam' : 'Nữ'" line :rows="1" />
    </div>
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Phòng khám:" :modelValue="hsBenhAn.SoPhong" line :rows="1" />
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Bệnh sử:" :modelValue="hsBenhAn.BenhAnChiTietObj.QuaTrinhBenhLy" line :rows="1" />
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Chẩn đoán:" :modelValue="hsBenhAn.ChanDoan" line :rows="1" />
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Tiền sử bệnh:" :modelValue="hsBenhAn.BenhAnChiTietObj.TienSuBenh_BanThan" line :rows="1" />
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 4px;">
    <div class="col-3">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng:&nbsp;</span>
        <Textarea v-model="hsBenhAn.CanNang" line :rows="1" style="width: 55px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;kg</span>
      </div>
    </div>
    <div class="col-4">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Chiều cao:&nbsp;</span>
        <Textarea v-model="hsBenhAn.ChieuCao" line :rows="1" style="width: 75px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;cm</span>
      </div>
    </div>
    <div class="col-5">
      <Textarea label="Chỉ số khối cơ thể (BMI):"
        :modelValue="hsBenhAn.CanNang && hsBenhAn.ChieuCao ? (Number(hsBenhAn.CanNang) / Math.pow(Number(hsBenhAn.ChieuCao) / 100, 2)).toFixed(1) : (data.BMI || '')"
        @update:modelValue="data.BMI = $event"
        line :rows="1" />
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 10px;">
    <div class="col-4">
      Sụt cân trong 3 tháng gần đây:
    </div>
    <div class="col-4">
      <div style="margin-bottom: 3px;">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="KHONG">
          <template #afterText><span style="margin-left: 6px;">Không</span></template>
        </Checkbox>
      </div>
      <div class="d-flex align-items-center">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="CO">
          <template #afterText><span style="margin-left: 6px;">Có&nbsp;</span></template>
        </Checkbox>
        <Textarea v-model="data.SoKgSutCan" line :rows="1" style="width: 70px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;(kg)</span>
      </div>
    </div>
    <div class="col-4">
      <div style="margin-bottom: 3px;">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="CO_KHONG_BIET">
          <template #afterText><span style="margin-left: 6px;">Có nhưng không biết</span></template>
        </Checkbox>
      </div>
      <div>
        <Textarea label="Tỷ lệ % sụt cân:" v-model="data.TyLePhanTramSutCan" line :rows="1" />
      </div>
    </div>
  </div>

  <!-- Phần I -->
  <div style="margin-bottom: 8px;">
    <span class="font-weight-bold">Phần I: Sàng lọc nguy cơ suy dinh dưỡng (SDD)</span>
    <span>&nbsp;(Phần dành cho Điều dưỡng)</span>
  </div>

  <table class="table table-bordered" style="width: 100%; border: 1px solid #000; border-collapse: collapse; margin-bottom: 10px;">
    <thead>
      <tr class="text-center font-italic">
        <th colspan="2" style="width: 70%; border: 1px solid #000; padding: 4px 8px; font-weight: normal;">
          Yếu tố dinh dưỡng
        </th>
        <th style="width: 30%; border: 1px solid #000; padding: 4px 8px; font-weight: normal;">
          Điểm
        </th>
      </tr>
    </thead>
    <tbody>
      <!-- Giá trị BMI -->
      <tr>
        <td class="font-italic" style="width: 48%; border: 1px solid #000; border-right: none; padding: 4px 8px; vertical-align: top;">
          Giá trị BMI
        </td>
        <td class="font-italic text-center" style="width: 22%; border: 1px solid #000; border-left: none; padding: 4px 8px; vertical-align: top; line-height: 1.55;">
          <div>&gt;20</div>
          <div>18,5-20,0</div>
          <div>&lt;18</div>
        </td>
        <td style="border: 1px solid #000; padding: 4px 12px; vertical-align: top; line-height: 1.55;">
          <div>
            <Checkbox size="md" v-model="data.DiemBMI" value="0">
              <template #afterText><span style="margin-left: 6px;">0 điểm</span></template>
            </Checkbox>
          </div>
          <div>
            <Checkbox size="md" v-model="data.DiemBMI" value="1">
              <template #afterText><span style="margin-left: 6px;">1 điểm</span></template>
            </Checkbox>
          </div>
          <div>
            <Checkbox size="md" v-model="data.DiemBMI" value="2">
              <template #afterText><span style="margin-left: 6px;">2 điểm</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>

      <!-- Tỉ lệ % sụt cân -->
      <tr>
        <td class="font-italic" style="border: 1px solid #000; border-right: none; padding: 4px 8px; vertical-align: top;">
          Tỉ lệ % sụt cân trong 3 tháng gần đây
        </td>
        <td class="font-italic text-center" style="border: 1px solid #000; border-left: none; padding: 4px 8px; vertical-align: top; line-height: 1.55;">
          <div>&lt;5%</div>
          <div>5%-10%</div>
          <div>&gt;10%</div>
        </td>
        <td style="border: 1px solid #000; padding: 4px 12px; vertical-align: top; line-height: 1.55;">
          <div>
            <Checkbox size="md" v-model="data.DiemSutCan" value="0">
              <template #afterText><span style="margin-left: 6px;">0 điểm</span></template>
            </Checkbox>
          </div>
          <div>
            <Checkbox size="md" v-model="data.DiemSutCan" value="1">
              <template #afterText><span style="margin-left: 6px;">1 điểm</span></template>
            </Checkbox>
          </div>
          <div>
            <Checkbox size="md" v-model="data.DiemSutCan" value="2">
              <template #afterText><span style="margin-left: 6px;">2 điểm</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>

      <!-- Bệnh lý cấp -->
      <tr>
        <td class="font-italic" style="border: 1px solid #000; border-right: none; padding: 4px 8px; vertical-align: top;">
          Người bệnh có bệnh lý cấp hoặc gần như không ăn gì trong hơn 5 ngày qua
        </td>
        <td class="font-italic text-center" style="border: 1px solid #000; border-left: none; padding: 4px 8px; vertical-align: top; line-height: 1.55;">
          <div>Không</div>
          <div>Có</div>
        </td>
        <td style="border: 1px solid #000; padding: 4px 12px; vertical-align: top; line-height: 1.55;">
          <div>
            <Checkbox size="md" v-model="data.DiemBenhLyCap" value="0">
              <template #afterText><span style="margin-left: 6px;">0 điểm</span></template>
            </Checkbox>
          </div>
          <div>
            <Checkbox size="md" v-model="data.DiemBenhLyCap" value="1">
              <template #afterText><span style="margin-left: 6px;">1 điểm</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Chữ ký Điều dưỡng -->
  <div class="row no-gutters" style="margin-bottom: 14px;">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyDieuDuong" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày........ tháng........ năm 20........."
          style="text-align: center; font-style: italic; width: 290px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold" style="margin-top: 2px;">Điều dưỡng</div>
      <div class="font-italic" style="font-size: 11pt;">(Ký, ghi rõ họ tên)</div>
      <div style="height: 2cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="DieuDuong" />
      </div>
    </div>
  </div>

  <!-- Phần 2 -->
  <div class="font-weight-bold" style="margin-bottom: 8px;">
    Phần 2: Đánh giá mức độ nguy cơ SDD và đề xuất giải pháp dinh dưỡng(Phần dành cho Bác sĩ)
  </div>

  <div class="row no-gutters font-weight-bold" style="margin-bottom: 6px;">
    <div class="col-5">Mức độ nguy cơ</div>
    <div class="col-7">Giải pháp dinh dưỡng</div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 6px;">
    <div class="col-5">
      <Checkbox size="md" v-model="data.MucDoNguyCo" value="KHONG">
        <template #afterText><span style="margin-left: 6px;">Không nguy cơ (0 điểm)</span></template>
      </Checkbox>
    </div>
    <div class="col-7">
      Duy trì chế độ ăn như trước đây.
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 6px;">
    <div class="col-5">
      <Checkbox size="md" v-model="data.MucDoNguyCo" value="TRUNG_BINH">
        <template #afterText><span style="margin-left: 6px;">Nguy cơ trung bình (1 điểm)</span></template>
      </Checkbox>
    </div>
    <div class="col-7">
      Hướng dẫn người bệnh tăng cường DD từ thức ăn, thức uống dinh dưỡng phù hợp
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 6px;">
    <div class="col-5">
      <Checkbox size="md" v-model="data.MucDoNguyCo" value="CAO">
        <template #afterText><span style="margin-left: 6px;">Nguy cơ cao (2-4 điểm)</span></template>
      </Checkbox>
    </div>
    <div class="col-7">
      <div>Hướng dẫn bổ sung DD qua tiêu hóa phù hợp</div>
      <div>Hoặc khám chuyên khoa dinh dưỡng.</div>
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 12px;">
    <div class="col-5">
      <div>
        <Checkbox size="md" v-model="data.MucDoNguyCo" value="RAT_CAO">
          <template #afterText><span style="margin-left: 6px;">Nguy cơ rất cao hoặc SDD nặng</span></template>
        </Checkbox>
      </div>
      <div style="margin-top: 2px;">( &gt;4 điểm hoặc BMI&lt;16,0 hoặc &gt;30)</div>
    </div>
    <div class="col-7">
      Khám chuyên khoa dinh dưỡng.
    </div>
  </div>

  <!-- Chữ ký Bác sĩ -->
  <div class="row no-gutters">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyBacSi" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày...... tháng...... năm 20........"
          style="text-align: center; font-style: italic; width: 290px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold" style="margin-top: 2px;">Bác sĩ</div>
      <div style="height: 2cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="BacSi" />
      </div>
    </div>
  </div>
</PageA4>
