<PageA4 style="padding: 10mm 14mm 10mm 16mm; font-size: 10.5pt; line-height: 1.3; height: auto !important;">
  <!-- Mã biểu mẫu góc trên phải -->
  <div class="text-right" style="font-size: 9.5pt; color: #666; margin-bottom: 2px; text-align: right;">
    BM 02
  </div>

  <!-- Header -->
  <div class="row no-gutters" style="margin-bottom: 8px;">
    <div class="col-4 text-center">
      <div class="font-weight-bold" style="font-size: 10.5pt; line-height: 1.25;">
        <div>BỆNH VIỆN TÂM THẦN</div>
        <div>THÀNH PHỐ ĐÀ NẴNG</div>
      </div>
      <div style="margin-top: 2px; text-align: left; padding-left: 6px;">
        <Textarea label="Khoa:" :modelValue="hsBenhAn.TenKhoaKham" line :rows="1" />
      </div>
    </div>

    <div class="col-5 text-center" style="padding: 0 4px;">
      <div class="font-weight-bold" style="font-size: 12pt; line-height: 1.25;">
        PHIẾU SÀNG LỌC VÀ ĐÁNH GIÁ DINH DƯỠNG NGƯỜI BỆNH NỘI TRÚ
      </div>
    </div>

    <div class="col-3" style="font-size: 9.5pt; padding-left: 8px; line-height: 1.3;">
      <div>MS: DD-03</div>
      <div>
        <Textarea label="Số vào viện:" :modelValue="hsBenhAn.SoVaoVien" line :rows="1" />
      </div>
      <div>
        <Textarea label="Mã người bệnh:" :modelValue="hsBenhAn.BenhNhan.Ma" line :rows="1" />
      </div>
    </div>
  </div>

  <!-- Thông tin hành chính -->
  <div class="row no-gutters" style="margin-bottom: 2px;">
    <div class="col-7">
      <Textarea label="Họ tên người bệnh:" :modelValue="hsBenhAn.BenhNhan.HoTen" line :rows="1" />
    </div>
    <div class="col-2" style="padding-left: 4px;">
      <Textarea label="Tuổi:" :modelValue="hsBenhAn.Tuoi" line :rows="1" />
    </div>
    <div class="col-3" style="padding-left: 4px;">
      <Textarea label="Nam/Nữ:" :modelValue="hsBenhAn.BenhNhan.GioiTinh ? 'Nam' : 'Nữ'" line :rows="1" />
    </div>
  </div>

  <div style="margin-bottom: 2px;">
    <Textarea label="Chẩn đoán:" :modelValue="hsBenhAn.ChanDoan" line :rows="1" />
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 2px;">
    <div class="col-4">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng vào viện:&nbsp;</span>
        <Textarea v-model="hsBenhAn.CanNang" line :rows="1" style="width: 55px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;kg</span>
      </div>
    </div>
    <div class="col-3">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Chiều cao:&nbsp;</span>
        <Textarea v-model="hsBenhAn.ChieuCao" line :rows="1" style="width: 55px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;cm</span>
      </div>
    </div>
    <div class="col-5">
      <Textarea label="Chỉ số khối cơ thể (BMI):"
        :modelValue="hsBenhAn.CanNang && hsBenhAn.ChieuCao ? (Number(hsBenhAn.CanNang) / Math.pow(Number(hsBenhAn.ChieuCao) / 100, 2)).toFixed(1) : (data.BMI || '')"
        @update:modelValue="data.BMI = $event"
        line :rows="1" />
    </div>
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 2px;">
    <div class="col-4">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng ra viện:&nbsp;</span>
        <Textarea v-model="data.CanNangRaVien" line :rows="1" style="width: 65px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;Kg</span>
      </div>
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 6px;">
    <div class="col-4">
      Sụt cân trong 3 tháng gần đây:
    </div>
    <div class="col-4">
      <div style="margin-bottom: 2px;">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="KHONG">
          <template #afterText><span style="margin-left: 5px;">Không</span></template>
        </Checkbox>
      </div>
      <div class="d-flex align-items-center">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="CO">
          <template #afterText><span style="margin-left: 5px;">Có&nbsp;</span></template>
        </Checkbox>
        <Textarea v-model="data.SoKgSutCan" line :rows="1" style="width: 65px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;(kg)</span>
      </div>
    </div>
    <div class="col-4">
      <div style="margin-bottom: 2px;">
        <Checkbox size="md" v-model="data.SutCan3Thang" value="CO_KHONG_BIET">
          <template #afterText><span style="margin-left: 5px;">Có nhưng không biết</span></template>
        </Checkbox>
      </div>
      <div>
        <Textarea label="Tỷ lệ % sụt cân:" v-model="data.TyLePhanTramSutCan" line :rows="1" />
      </div>
    </div>
  </div>

  <!-- Phần I -->
  <div style="margin-bottom: 4px;">
    <span class="font-weight-bold">Phần I: Sàng lọc nguy cơ suy dinh dưỡng (SDD)</span>
    <span>&nbsp;(Phần dành cho Điều dưỡng)</span>
  </div>

  <table class="table table-bordered" style="width: 100%; border: 1px solid #000; border-collapse: collapse; margin-bottom: 6px; font-size: 9.5pt;">
    <thead>
      <tr class="text-center font-weight-bold">
        <th style="width: 33%; border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">Suy giảm tình trạng DD</th>
        <th style="width: 14%; border: 1px solid #000; padding: 3px 4px; vertical-align: middle;">Mức độ</th>
        <th style="width: 39%; border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">Ảnh hưởng của bệnh lý</th>
        <th style="width: 14%; border: 1px solid #000; padding: 3px 4px; vertical-align: middle;">Mức độ</th>
      </tr>
    </thead>
    <tbody>
      <!-- Mức độ Nhẹ (1 điểm) -->
      <tr>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          <div>- Sụt &ge; 5% CN/ 3 tháng hoặc</div>
          <div>- Ăn giảm còn 50-75%/1 tuần trước đây</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoSuyGiamDD" value="1">
            <template #afterText><span style="margin-left: 4px;">Nhẹ</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(1 điểm)</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          - Gãy xương đùi (xương lớn), bệnh lý mạn hoặc đợt cấp nhẹ/bệnh lý mạn tính...
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoAnhHuongBenhLy" value="1">
            <template #afterText><span style="margin-left: 4px;">Nhẹ</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(1 điểm)</div>
        </td>
      </tr>

      <!-- Mức độ Trung bình (2 điểm) -->
      <tr>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          <div>- Sụt &ge; 5% CN/ 2 tháng hoặc</div>
          <div>- Ăn giảm còn 25-50%/1 tuần hoặc</div>
          <div>- BMI từ 18,5-20,5</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoSuyGiamDD" value="2">
            <template #afterText><span style="margin-left: 4px;">Trung bình</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(2 điểm)</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          - Đột quỵ, nhồi máu cơ tim, phẫu thuật lớn, viêm phổi, ung thư máu...
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoAnhHuongBenhLy" value="2">
            <template #afterText><span style="margin-left: 4px;">Trung bình</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(2 điểm)</div>
        </td>
      </tr>

      <!-- Mức độ Nặng (3 điểm) -->
      <tr>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          <div>- Sụt &ge; 5% CN/ 1 tháng hoặc</div>
          <div>- Ăn giảm còn 0-25%/1 tuần hoặc</div>
          <div>- BMI &lt;18,5</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoSuyGiamDD" value="3">
            <template #afterText><span style="margin-left: 4px;">Nặng</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(3 điểm)</div>
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: top;">
          - Bệnh nặng (như điều trị hồi sức)
        </td>
        <td style="border: 1px solid #000; padding: 3px 4px; vertical-align: top;">
          <Checkbox size="sm" v-model="data.MucDoAnhHuongBenhLy" value="3">
            <template #afterText><span style="margin-left: 4px;">Nặng</span></template>
          </Checkbox>
          <div style="padding-left: 14px;">(3 điểm)</div>
        </td>
      </tr>

      <!-- Tổng điểm -->
      <tr>
        <td colspan="4" style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          <div class="d-flex align-items-center">
            <span class="font-weight-bold text-nowrap">Tổng điểm:&nbsp;</span>
            <Textarea v-model="data.TongDiem" line :rows="1" style="width: 90px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;(Cộng thêm 1 điểm nếu người bệnh &ge; 70 tuổi).</span>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Kết quả sàng lọc -->
  <div style="padding-left: 20px; margin-bottom: 4px;">
    <div class="font-weight-bold" style="font-size: 9.5pt;">Kết quả:</div>
    <div style="padding-left: 10px;">
      - Không nguy cơ SDD: khi điểm &lt; 3 – Kết thúc đánh giá và đánh giá lại sau 7 ngày.
    </div>
    <div style="padding-left: 10px;">
      - Có nguy cơ SDD: khi điểm &ge; 3 – Chẩn đoán SDD, có kế hoạch chăm sóc DD kịp thời.
    </div>
  </div>

  <!-- Chữ ký Điều dưỡng -->
  <div class="row no-gutters" style="margin-bottom: 8px;">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyDieuDuong" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày........ tháng........ năm 20........."
          style="text-align: center; font-style: italic; width: 280px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold">Điều dưỡng</div>
      <div class="font-italic" style="font-size: 10pt;">(Ký, ghi rõ họ tên)</div>
      <div style="height: 1.6cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="DieuDuong" />
      </div>
    </div>
  </div>

  <!-- Phần II -->
  <div class="font-weight-bold" style="margin-bottom: 4px;">
    Phần II: Chẩn đoán suy dinh dưỡng (Phần dành cho Bác sỹ)
  </div>

  <div class="row no-gutters font-weight-bold text-center" style="margin-bottom: 4px;">
    <div class="col-6">Tiêu chí kiểu hình</div>
    <div class="col-6">Tiêu chí nguyên nhân</div>
  </div>

  <!-- Hàng 1 tiêu chí -->
  <div class="row no-gutters" style="margin-bottom: 4px;">
    <div class="col-4" style="padding-right: 6px;">
      Sụt cân &ge; 5%/ 3 tháng gần đây?
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.KieuHinh_SutCan" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.KieuHinh_SutCan" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
    <div class="col-4" style="padding-left: 8px; padding-right: 6px;">
      Người bệnh ăn uống giảm sút kéo dài trên 1 tuần?
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.NguyenNhan_AnUongGiam" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.NguyenNhan_AnUongGiam" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
  </div>

  <!-- Hàng 2 tiêu chí -->
  <div class="row no-gutters" style="margin-bottom: 4px;">
    <div class="col-4" style="padding-right: 6px;">
      BMI &lt; 18,5 nếu NB &lt; 70 tuổi, hoặc BMI &lt; 20 nếu NB &ge; 70 tuổi
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.KieuHinh_BMIThap" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.KieuHinh_BMIThap" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
    <div class="col-4" style="padding-left: 8px; padding-right: 6px;">
      Hoặc có bệnh lý tiêu hóa mạn tính gây kém tiêu hóa/ hấp thu.
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.NguyenNhan_BenhLyTieuHoa" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.NguyenNhan_BenhLyTieuHoa" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
  </div>

  <!-- Hàng 3 tiêu chí -->
  <div class="row no-gutters" style="margin-bottom: 4px;">
    <div class="col-4" style="padding-right: 6px;">
      Teo/giảm khối cơ (ngoại vi...)
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.KieuHinh_TeoCo" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.KieuHinh_TeoCo" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
    <div class="col-6"></div>
  </div>

  <!-- Hàng 4 tiêu chí -->
  <div class="row no-gutters" style="margin-bottom: 6px;">
    <div class="col-4" style="padding-right: 6px;">
      Phù ngoại vi
    </div>
    <div class="col-2">
      <div class="d-flex align-items-center" style="font-size: 9.5pt;">
        <Checkbox size="sm" v-model="data.KieuHinh_PhuNgoaiVi" value="KHONG">
          <template #afterText><span style="margin-left: 3px; margin-right: 6px;">Không</span></template>
        </Checkbox>
        <Checkbox size="sm" v-model="data.KieuHinh_PhuNgoaiVi" value="CO">
          <template #afterText><span style="margin-left: 3px;">Có</span></template>
        </Checkbox>
      </div>
    </div>
    <div class="col-6"></div>
  </div>

  <!-- Chẩn đoán -->
  <div style="padding-left: 20px; margin-bottom: 6px;">
    <div class="font-weight-bold">Chẩn đoán:</div>
    <div>- Không SDD: khi trả lời “Không” cho tất cả tiêu chí trên.</div>
    <div>- Đã bị SDD: Khi có ít nhất 1 tiêu chí kiểu hình và 1 tiêu chí nguyên nhân.</div>
  </div>

  <!-- Phần III -->
  <div class="font-weight-bold" style="margin-bottom: 4px;">
    Phần III: Xác nhận kế hoạch chăm sóc DD
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 3px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_BoSungQuaMieng">
        <template #afterText><span style="margin-left: 6px;">Bổ sung DD qua miệng</span></template>
      </Checkbox>
    </div>
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_QuaOngThong">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua ống thông</span></template>
      </Checkbox>
    </div>
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 3px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_TinhMachToanPhan">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua tĩnh mạch toàn phần</span></template>
      </Checkbox>
    </div>
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_TinhMachBoSung">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua tĩnh mạch bổ sung</span></template>
      </Checkbox>
    </div>
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 6px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_HoiChanDD">
        <template #afterText><span style="margin-left: 6px;">Hội chẩn DD.</span></template>
      </Checkbox>
    </div>
  </div>

  <!-- Chữ ký Bác sĩ -->
  <div class="row no-gutters">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyBacSi" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày........ tháng........ năm 20........."
          style="text-align: center; font-style: italic; width: 280px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold" style="margin-top: 2px;">Bác sĩ</div>
      <div style="height: 1.6cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="BacSi" />
      </div>
    </div>
  </div>
</PageA4>
