<PageA4 style="padding: 12mm 15mm 12mm 18mm; font-size: 11pt; line-height: 1.35; height: auto !important;">
  <!-- Mã biểu mẫu góc trên phải -->
  <div class="text-right" style="font-size: 9.5pt; color: #666; margin-bottom: 4px; text-align: right;">
    BM 04
  </div>

  <!-- Header -->
  <div class="row no-gutters" style="margin-bottom: 10px;">
    <div class="col-4 text-center">
      <div class="font-weight-bold" style="font-size: 10.5pt; line-height: 1.25;">
        <div>BỆNH VIỆN TÂM THẦN</div>
        <div>THÀNH PHỐ ĐÀ NẴNG</div>
      </div>
      <div style="margin-top: 4px; text-align: left; padding-left: 6px;">
        <Textarea label="Khoa:" :modelValue="hsBenhAn.TenKhoaKham" line :rows="1" />
      </div>
    </div>

    <div class="col-5 text-center" style="padding: 0 6px;">
      <div class="font-weight-bold" style="font-size: 12.5pt; line-height: 1.3;">
        PHIẾU SÀNG LỌC VÀ ĐÁNH GIÁ DINH DƯỠNG BỆNH NHI
      </div>
    </div>

    <div class="col-3" style="font-size: 9.5pt; padding-left: 8px; line-height: 1.35;">
      <div>MS: DD-06</div>
      <div>
        <Textarea label="Số vào viện:" :modelValue="hsBenhAn.SoVaoVien" line :rows="1" />
      </div>
      <div>
        <Textarea label="Mã người bệnh:" :modelValue="hsBenhAn.BenhNhan.Ma" line :rows="1" />
      </div>
    </div>
  </div>

  <!-- Thông tin hành chính -->
  <div class="row no-gutters align-items-center" style="margin-bottom: 4px;">
    <div class="col-6">
      <Textarea label="Họ và tên người bệnh:" :modelValue="hsBenhAn.BenhNhan.HoTen" line :rows="1" />
    </div>
    <div class="col-3" style="padding-left: 6px;">
      <Textarea label="Tuổi:" :modelValue="hsBenhAn.Tuoi" line :rows="1" />
    </div>
    <div class="col-3" style="padding-left: 8px;">
      <div class="d-flex align-items-center">
        <Checkbox size="md" :modelValue="hsBenhAn.BenhNhan.GioiTinh" :value="true">
          <template #afterText><span style="margin-left: 4px; margin-right: 10px;">Nam</span></template>
        </Checkbox>
        <Checkbox size="md" :modelValue="hsBenhAn.BenhNhan.GioiTinh" :value="false">
          <template #afterText><span style="margin-left: 4px;">Nữ</span></template>
        </Checkbox>
      </div>
    </div>
  </div>

  <div class="row no-gutters" style="margin-bottom: 4px;">
    <div class="col-5">
      <Textarea label="Khoa:" :modelValue="hsBenhAn.TenKhoaKham" line :rows="1" />
    </div>
    <div class="col-4" style="padding-left: 6px;">
      <Textarea label="Phòng:" :modelValue="hsBenhAn.SoPhong" line :rows="1" />
    </div>
    <div class="col-3" style="padding-left: 6px;">
      <Textarea label="Giường:" :modelValue="hsBenhAn.SoGiuong" line :rows="1" />
    </div>
  </div>

  <div style="margin-bottom: 4px;">
    <Textarea label="Chẩn đoán:" :modelValue="hsBenhAn.ChanDoan" line :rows="1" />
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 4px;">
    <div class="col-4">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng:&nbsp;</span>
        <Textarea v-model="hsBenhAn.CanNang" line :rows="1" style="width: 75px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;(kg)</span>
      </div>
    </div>
    <div class="col-4">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Chiều cao:&nbsp;</span>
        <Textarea v-model="hsBenhAn.ChieuCao" line :rows="1" style="width: 85px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;(cm)</span>
      </div>
    </div>
    <div class="col-4">
      <Textarea label="BMI:"
        :modelValue="hsBenhAn.CanNang && hsBenhAn.ChieuCao ? (Number(hsBenhAn.CanNang) / Math.pow(Number(hsBenhAn.ChieuCao) / 100, 2)).toFixed(1) : (data.BMI || '')"
        @update:modelValue="data.BMI = $event"
        line :rows="1" />
    </div>
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 2px;">
    <div class="col-6">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng chuẩn so với tuổi:&nbsp;</span>
        <Textarea v-model="data.CanNangChuanSD" line :rows="1" style="width: 80px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;SD</span>
      </div>
    </div>
    <div class="col-6">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Chiều cao chuẩn so với tuổi:&nbsp;</span>
        <Textarea v-model="data.ChieuCaoChuanSD" line :rows="1" style="width: 65px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;SD&nbsp;<em>(Theo</em></span>
      </div>
    </div>
  </div>
  <div class="font-italic" style="margin-bottom: 6px;">
    hướng dẫn của Tổ chức Y thế giới)
  </div>

  <!-- Phần I -->
  <div style="margin-bottom: 4px;">
    <span class="font-weight-bold">Phần I: Sàng lọc nguy cơ suy dinh dưỡng (SDD)</span>
    <span>&nbsp;(Phần dành cho Điều dưỡng)</span>
  </div>

  <div class="row no-gutters font-weight-bold text-center" style="margin-bottom: 2px;">
    <div class="col-8">Yếu tố nguy cơ</div>
    <div class="col-4">Điểm</div>
  </div>

  <table class="table table-bordered" style="width: 100%; border: 1px solid #000; border-collapse: collapse; margin-bottom: 6px;">
    <tbody>
      <!-- Câu 1 -->
      <tr>
        <td style="width: 72%; border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          Người bệnh (NB) có bệnh lý nền gây nguy cơ SDD hoặc dự kiến phẫu thuật?
        </td>
        <td style="width: 28%; border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div class="d-flex align-items-center">
            <Checkbox size="md" v-model="data.YeuTo1" value="0">
              <template #afterText><span style="margin-left: 5px; margin-right: 10px;">Không</span></template>
            </Checkbox>
            <Checkbox size="md" v-model="data.YeuTo1" value="2">
              <template #afterText><span style="margin-left: 5px;">Có (2 điểm)</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>

      <!-- Câu 2 -->
      <tr>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          Khám lâm sàng có mất lớp mỡ dưới da và/hoặc teo cơ...
        </td>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div class="d-flex align-items-center">
            <Checkbox size="md" v-model="data.YeuTo2" value="0">
              <template #afterText><span style="margin-left: 5px; margin-right: 10px;">Không</span></template>
            </Checkbox>
            <Checkbox size="md" v-model="data.YeuTo2" value="1">
              <template #afterText><span style="margin-left: 5px;">Có (1 điểm)</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>

      <!-- Câu 3 -->
      <tr>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div>Khi có ít nhất 01 trong các yếu tố sau:</div>
          <div>- Tiêu chảy (&gt; 5 ngày) và/hoặc nôn (&gt; 3 lần/ngày) kéo dài 1-3 ngày</div>
          <div>- Ăn hoặc bú giảm kéo dài 1-3 ngày</div>
          <div>- Đã can thiệp DD trước đó (như bổ sung DD qua miệng hoặc qua ống thông)</div>
          <div>Không thể thu nạp đủ dinh dưỡng do đau</div>
        </td>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div class="d-flex align-items-center">
            <Checkbox size="md" v-model="data.YeuTo3" value="0">
              <template #afterText><span style="margin-left: 5px; margin-right: 10px;">Không</span></template>
            </Checkbox>
            <Checkbox size="md" v-model="data.YeuTo3" value="1">
              <template #afterText><span style="margin-left: 5px;">Có (1 điểm)</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>

      <!-- Câu 4 -->
      <tr>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          Có bị sụt cân (mọi lứa tuổi) và/hoặc không tăng cân/ chiều cao (trẻ em &lt; 1 tuổi) trong vòng 3 tháng gần đây?
        </td>
        <td style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div class="d-flex align-items-center">
            <Checkbox size="md" v-model="data.YeuTo4" value="0">
              <template #afterText><span style="margin-left: 5px; margin-right: 10px;">Không</span></template>
            </Checkbox>
            <Checkbox size="md" v-model="data.YeuTo4" value="1">
              <template #afterText><span style="margin-left: 5px;">Có (1 điểm)</span></template>
            </Checkbox>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Tổng điểm & Kết quả -->
  <div class="d-flex align-items-center" style="margin-bottom: 4px;">
    <span class="font-weight-bold text-nowrap">Tổng điểm:&nbsp;</span>
    <Textarea v-model="data.TongDiem" line :rows="1" style="width: 120px;" textareaStyle="text-align: center;" />
  </div>

  <div style="margin-bottom: 6px;">
    <div class="font-weight-bold">Kết quả:</div>
    <div>- Nguy cơ thấp: 0 điểm (Kết thúc đánh giá và đánh giá lại sau 7 ngày).</div>
    <div>- Nguy cơ trung bình: từ 1 - 3 điểm (Khuyến cáo can thiệp DD, cân lại người bệnh 2 lần/tuần và đánh giá lại nguy cơ mỗi tuần).</div>
    <div>- Nguy cơ cao: từ 4-5 điểm (Mời hội chẩn DD)</div>
  </div>

  <!-- Chữ ký Điều dưỡng -->
  <div class="row no-gutters" style="margin-bottom: 12px;">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyDieuDuong" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày........ tháng........ năm 20........."
          style="text-align: center; font-style: italic; width: 290px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold" style="margin-top: 2px;">Điều dưỡng</div>
      <div class="font-italic" style="font-size: 10.5pt;">(Ký, ghi rõ họ tên)</div>
      <div style="height: 1.8cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="DieuDuong" />
      </div>
    </div>
  </div>

  <!-- Phần II -->
  <div style="margin-bottom: 6px;">
    <span class="font-weight-bold">Phần II: Xác nhận kế hoạch chăm sóc DD</span>
    <span>&nbsp;(Phần dành cho bác sỹ)</span>
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 4px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_BoSungQuaMieng">
        <template #afterText><span style="margin-left: 6px;">Bổ sung DD qua miệng</span></template>
      </Checkbox>
    </div>
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_QuaOngThong">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua ống thông</span></template>
      </Checkbox>
    </div>
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 4px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_TinhMachToanPhan">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua tĩnh mạch toàn phần</span></template>
      </Checkbox>
    </div>
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_TinhMachBoSung">
        <template #afterText><span style="margin-left: 6px;">Chế độ DD qua tĩnh mạch bổ sung</span></template>
      </Checkbox>
    </div>
  </div>

  <div class="row no-gutters" style="padding-left: 10px; margin-bottom: 8px;">
    <div class="col-6">
      <Checkbox size="md" native v-model="data.KeHoach_HoiChanDD">
        <template #afterText><span style="margin-left: 6px;">Hội chẩn DD.</span></template>
      </Checkbox>
    </div>
  </div>

  <!-- Chữ ký Bác sĩ -->
  <div class="row no-gutters">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-italic">
        <DatePicker v-model="data.NgayKyBacSi" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày........ tháng........ năm 20........."
          style="text-align: center; font-style: italic; width: 290px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
      <div class="font-weight-bold" style="margin-top: 2px;">Bác sĩ</div>
      <div class="font-italic" style="font-size: 10.5pt;">(Ký, ghi rõ họ tên)</div>
      <div style="height: 1.8cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="BacSi" />
      </div>
    </div>
  </div>
</PageA4>
