<PageA4 style="padding: 10mm 14mm 10mm 16mm; font-size: 10.5pt; line-height: 1.3; height: auto !important;">
  <!-- Mã biểu mẫu góc trên phải -->
  <div class="text-right" style="font-size: 9.5pt; color: #666; margin-bottom: 2px; text-align: right;">
    BM 08
  </div>

  <!-- Header -->
  <div class="row no-gutters" style="margin-bottom: 10px;">
    <div class="col-5 text-center">
      <div class="font-weight-bold" style="font-size: 10.5pt; line-height: 1.25;">
        <div>BỆNH VIỆN TÂM THẦN</div>
        <div>THÀNH PHỐ ĐÀ NẴNG</div>
      </div>
      <div style="margin-top: 4px; text-align: left; padding-left: 12px;">
        <Textarea label="Khoa:" :modelValue="hsBenhAn.TenKhoaKham" line :rows="1" />
      </div>
    </div>

    <div class="col-7 text-center" style="padding: 0 4px;">
      <div class="font-weight-bold" style="font-size: 12.5pt; line-height: 1.25;">
        PHIẾU TƯ VẤN DINH DƯỠNG
      </div>
      <div style="margin-top: 2px;">
        <DatePicker v-model="data.NgayTuVan" format="[Đà Nẵng, ngày] DD [tháng] MM [năm] YYYY"
          placeholder="Đà Nẵng, ngày ..... tháng ... năm ......"
          style="text-align: center; font-style: italic; width: 280px; margin: 0 auto;"
          inputStyle="text-align: center; font-style: italic;" />
      </div>
    </div>
  </div>

  <!-- Thông tin hành chính -->
  <div style="margin-bottom: 3px;">
    <Textarea label="Họ và tên người bệnh:" :modelValue="hsBenhAn.BenhNhan.HoTen" line :rows="1" />
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 3px;">
    <div class="col-3">
      <Textarea label="Tuổi:" :modelValue="hsBenhAn.Tuoi" line :rows="1" />
    </div>
    <div class="col-4" style="padding-left: 6px;">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Giới:&nbsp;</span>
        <Checkbox size="sm" :modelValue="hsBenhAn.BenhNhan.GioiTinh" :value="true">
          <template #afterText><span style="margin-left: 4px; margin-right: 8px;">Nam</span></template>
        </Checkbox>
        <Checkbox size="sm" :modelValue="hsBenhAn.BenhNhan.GioiTinh" :value="false">
          <template #afterText><span style="margin-left: 4px;">Nữ</span></template>
        </Checkbox>
      </div>
    </div>
    <div class="col-5">
      <Textarea label="Nghề nghiệp:" :modelValue="hsBenhAn.BenhNhan.TenNgheNghiep" line :rows="1" />
    </div>
  </div>

  <div class="row no-gutters align-items-center" style="margin-bottom: 3px;">
    <div class="col-7">
      <div class="d-flex align-items-center">
        <span class="text-nowrap">Cân nặng:&nbsp;</span>
        <Textarea v-model="hsBenhAn.CanNang" line :rows="1" style="width: 40px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;kg&nbsp;&nbsp;Chiều cao:&nbsp;</span>
        <Textarea v-model="hsBenhAn.ChieuCao" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;cm&nbsp;&nbsp;BMI:&nbsp;</span>
        <Textarea
          :modelValue="hsBenhAn.CanNang && hsBenhAn.ChieuCao ? (Number(hsBenhAn.CanNang) / Math.pow(Number(hsBenhAn.ChieuCao) / 100, 2)).toFixed(1) : (data.BMI || '')"
          @update:modelValue="data.BMI = $event"
          line :rows="1" style="width: 55px;" textareaStyle="text-align: center;" />
      </div>
    </div>
    <div class="col-5">
      <div class="d-flex align-items-center">
        <span class="font-weight-bold text-nowrap">Mục tiêu:&nbsp;</span>
        <span class="text-nowrap">Cân nặng:&nbsp;</span>
        <Textarea v-model="data.MucTieuCanNang" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
        <span class="text-nowrap">&nbsp;kg&nbsp;BMI:&nbsp;</span>
        <Textarea v-model="data.MucTieuBMI" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
      </div>
    </div>
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Chẩn đoán bệnh:" :modelValue="hsBenhAn.ChanDoan" line :rows="1" />
  </div>

  <div style="margin-bottom: 3px;">
    <Textarea label="Chẩn đoán dinh dưỡng:" v-model="data.ChanDoanDinhDuong" line :rows="1" />
  </div>

  <div class="d-flex align-items-center" style="margin-bottom: 6px;">
    <span class="text-nowrap">Tư vấn: Chế độ dinh dưỡng:&nbsp;</span>
    <Textarea v-model="data.NangLuongKcalNgay" line :rows="1" style="width: 80px;" textareaStyle="text-align: center;" />
    <span class="text-nowrap">&nbsp;Kcal/ngày</span>
  </div>

  <!-- Bảng chế độ dinh dưỡng -->
  <table class="table table-bordered" style="width: 100%; border: 1px solid #000; border-collapse: collapse; margin-bottom: 8px; font-size: 10pt;">
    <thead>
      <tr>
        <th style="width: 16%; border: 1px solid #000; padding: 3px 6px; text-align: left;">Sáng 7g</th>
        <th class="font-italic" style="width: 17%; border: 1px solid #000; padding: 3px 6px; text-align: left;">9g-10g</th>
        <th style="width: 17%; border: 1px solid #000; padding: 3px 6px; text-align: left;">Trưa 11g</th>
        <th class="font-italic" style="width: 17%; border: 1px solid #000; padding: 3px 6px; text-align: left;">14g-15g</th>
        <th style="width: 16%; border: 1px solid #000; padding: 3px 6px; text-align: left;">Chiều 17g</th>
        <th class="font-italic" style="width: 17%; border: 1px solid #000; padding: 3px 6px; text-align: left;">20g-21g</th>
      </tr>
    </thead>
    <tbody>
      <!-- Ăn sáng -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          Ăn sáng
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          <Textarea v-model="data.BuaPhu_9g10g" line :rows="1" />
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          Cơm
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          <Textarea v-model="data.BuaPhu_14g15g" line :rows="1" />
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          Cơm
        </td>
        <td style="border: 1px solid #000; padding: 3px 6px; vertical-align: middle;">
          <Textarea v-model="data.BuaPhu_20g21g" line :rows="1" />
        </td>
      </tr>

      <!-- Bột đường -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: middle;">
          Bột đường
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: middle;">
          <div class="row no-gutters" style="margin-bottom: 6px;">
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Com">
                <template #beforeText><span style="margin-right: 4px;">Cơm:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Pho">
                <template #beforeText><span style="margin-right: 4px;">Phở:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_BanhMi">
                <template #beforeText><span style="margin-right: 4px;">Bánh mì:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Bap">
                <template #beforeText><span style="margin-right: 4px;">Bắp:</span></template>
              </Checkbox>
            </div>
          </div>
          <div class="row no-gutters">
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Bun">
                <template #beforeText><span style="margin-right: 4px;">Bún:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_HuTiu">
                <template #beforeText><span style="margin-right: 4px;">Hủ tíu:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Khoai">
                <template #beforeText><span style="margin-right: 4px;">Khoai:</span></template>
              </Checkbox>
            </div>
            <div class="col-3">
              <Checkbox size="sm" native v-model="data.BotDuong_Xoi">
                <template #beforeText><span style="margin-right: 4px;">Xôi:</span></template>
              </Checkbox>
            </div>
          </div>
        </td>
      </tr>

      <!-- Đạm -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: middle;">
          Đạm
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: middle;">
          <div class="d-flex align-items-center" style="margin-bottom: 3px;">
            <span class="text-nowrap">Thịt:&nbsp;</span>
            <Textarea v-model="data.Dam_ThitGram" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;g/ngày + Cá:&nbsp;</span>
            <Textarea v-model="data.Dam_CaGram" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;g/ngày +&nbsp;</span>
            <Textarea v-model="data.Dam_DauHuMieng" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;miếng đậu hũ</span>
          </div>
          <div class="d-flex align-items-center">
            <span class="text-nowrap">Trứng:&nbsp;</span>
            <Textarea v-model="data.Dam_TrungQua" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;quả/lần x&nbsp;</span>
            <Textarea v-model="data.Dam_TrungLanTuan" line :rows="1" style="width: 45px;" textareaStyle="text-align: center;" />
            <span class="text-nowrap">&nbsp;lần/tuần</span>
          </div>
        </td>
      </tr>

      <!-- Béo -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: middle;">
          Béo
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: middle;">
          <div style="margin-bottom: 2px;">
            <Textarea label="Ưu tiên dùng dầu thực vật: dầu nành, dầu mè, dầu oliu, mỡ cá" v-model="data.Beo_UuTien" line :rows="1" />
          </div>
          <div>
            <Textarea label="Hạn chế dùng mỡ, da gà, da heo, lòng heo, dầu dừa" v-model="data.Beo_HanChe" line :rows="1" />
          </div>
        </td>
      </tr>

      <!-- Rau -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: top;">
          Rau
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div>
            <u>300g/ngày:</u> ưu tiên các loại rau có lá màu xanh đậm (rau muống, rau ngót, rau đay, cải ngọt, súp lơ xanh, bông cải, cải xoăn, rau cải, xà lách...)
          </div>
          <Textarea v-model="data.Rau_GhiChu" line :rows="1" />
        </td>
      </tr>

      <!-- Trái cây -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: top;">
          Trái cây
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div>
            <u>200g/ngày:</u> 1 quả ổi/ 2-3 quả mận/ 200g dưa hấu/ 5 trái nhãn/ 5 trái vải/ 2 quả chuối cau/ 4 múi bưởi/ 1 quả cam/ 1 trái mãng cầu
          </div>
          <Textarea v-model="data.TraiCay_GhiChu" line :rows="1" />
        </td>
      </tr>

      <!-- Nước -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: middle;">
          Nước
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: middle;">
          Uống hàng ngày 1-2 lít nước chín đun sôi để nguội/ngày.
        </td>
      </tr>

      <!-- Sữa -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: top;">
          Sữa
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div style="margin-bottom: 2px;">Uống hàng ngày 200ml sữa/tối, trước khi ngủ ít nhất 30 phút.</div>
          <Textarea label="Nên chọn:" v-model="data.Sua_NenChon" line :rows="1" />
        </td>
      </tr>

      <!-- Muối và gia vị -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: top;">
          Muối và gia vị
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          <div>Ăn nhạt, hạn chế nêm muối, nước mắm, nước tương... khi chế biến thức ăn. (&lt;1 muỗng cà phê muối/ 1 ngày)</div>
          <div>Nên dùng bột ngọt với lượng ít thay cho bột nêm.</div>
          <div>Hạn chế chấm thêm nước chấm khi ăn.</div>
          <div>Không nên ăn các loại thực phẩm chế biến sẵn: giò chả, thịt hộp, cá hộp...</div>
          <Textarea v-model="data.MuoiGiaVi_GhiChu" line :rows="1" />
        </td>
      </tr>

      <!-- Vận động -->
      <tr>
        <td class="font-weight-bold" style="border: 1px solid #000; padding: 4px 6px; vertical-align: top;">
          Vận động
        </td>
        <td colspan="5" style="border: 1px solid #000; padding: 4px 8px; vertical-align: top;">
          Đi bộ ít nhất 30 phút/ngày, nên làm việc nhà nhẹ nhàng, tự chăm sóc bản thân, tham gia các hoạt động xã hội.
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Lời dặn -->
  <div style="margin-bottom: 10px;">
    <div class="font-weight-bold" style="margin-bottom: 2px;">Lời dặn:</div>
    <Textarea v-model="data.LoiDan" line :rows="2" />
  </div>

  <!-- Chữ ký Bác sĩ tư vấn -->
  <div class="row no-gutters">
    <div class="col-6"></div>
    <div class="col-6 text-center">
      <div class="font-weight-bold" style="font-size: 11pt;">BÁC SĨ TƯ VẤN</div>
      <div style="height: 2cm; display: flex; align-items: center; justify-content: center;">
        <Signature code="BacSiTuVan" />
      </div>
    </div>
  </div>
</PageA4>
